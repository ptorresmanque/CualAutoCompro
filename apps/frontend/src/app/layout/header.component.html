<header class="border-b border-border bg-surface">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
    <a
      routerLink="/"
      class="font-display text-xl font-bold text-brand-700 hover:text-brand-800"
    >
      cualautocompro
    </a>

    <nav class="flex items-center gap-4 font-sans text-sm">
      <a routerLink="/" class="text-ink-muted hover:text-ink">Catálogo</a>
      <a routerLink="/compare" class="text-ink-muted hover:text-ink">Comparar</a>

      @if (user()) {
        <a
          routerLink="/account/comparisons"
          class="text-ink-muted hover:text-ink"
        >
          Mi cuenta
        </a>
        <button
          type="button"
          (click)="logout()"
          class="rounded-md border border-border px-3 py-1.5 text-ink hover:bg-surface-muted"
        >
          Cerrar sesión
        </button>
      } @else {
        <a
          routerLink="/login"
          class="text-ink-muted hover:text-ink"
        >
          Iniciar sesión
        </a>
        <a
          routerLink="/register"
          class="rounded-md bg-brand-600 px-3 py-1.5 text-white hover:bg-brand-700"
        >
          Crear cuenta
        </a>
      }
    </nav>
  </div>
</header>
