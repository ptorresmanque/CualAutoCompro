<section class="admin-stat-grid">
  @for (c of cards(); track c.path) {
    <mat-card class="admin-stat-card" appearance="outlined">
      <a [routerLink]="c.path" class="admin-stat-link">
        <mat-card-content class="admin-stat-body">
          <h2 class="admin-stat-label">{{ c.label }}</h2>
          <p class="admin-stat-value">
            @if (c.loading) {
              <span class="admin-stat-pending">…</span>
            } @else if (c.count === null) {
              <span class="admin-stat-error">Error</span>
            } @else {
              {{ c.count }}
            }
          </p>
          <p class="admin-stat-cta">Administrar →</p>
        </mat-card-content>
      </a>
    </mat-card>
  }
</section>
