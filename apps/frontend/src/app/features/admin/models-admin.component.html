<section>
  <header class="flex items-center justify-between mb-4 gap-2">
    <h2 class="text-xl font-bold">Modelos</h2>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="openCreate()"
    >+ Nuevo</button>
  </header>

  <app-search-input
    placeholder="Buscar modelo, marca o segmento…"
    [value]="search()"
    (changed)="onSearch($event)"
  />

  @if (error(); as err) {
    <div class="mb-3 rounded border border-warn bg-warn-light px-3 py-2 text-sm text-warn-dark">{{ err }}</div>
  }

  @if (loading()) {
    <p class="text-sm text-ink-muted">Cargando…</p>
  } @else if (displayed().length === 0) {
    <p class="text-sm text-ink-muted">No hay modelos.</p>
  } @else {
    <table class="w-full text-sm">
      <thead class="text-left text-xs text-ink-muted">
        <tr>
          <th class="py-2">
            <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
              (click)="toggleSort('name')"
              [attr.aria-sort]="sortKey() === 'name' ? (sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
              Nombre
              <mat-icon class="sort-icon">{{ sortKey() === 'name' ? (sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</mat-icon>
            </button>
          </th>
          <th class="py-2">
            <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
              (click)="toggleSort('brandName')"
              [attr.aria-sort]="sortKey() === 'brandName' ? (sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
              Marca
              <mat-icon class="sort-icon">{{ sortKey() === 'brandName' ? (sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</mat-icon>
            </button>
          </th>
          <th class="py-2">
            <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
              (click)="toggleSort('segment')"
              [attr.aria-sort]="sortKey() === 'segment' ? (sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
              Segmento
              <mat-icon class="sort-icon">{{ sortKey() === 'segment' ? (sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</mat-icon>
            </button>
          </th>
          <th class="py-2 w-40">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (m of displayed(); track m.id) {
          <tr class="border-t border-border">
            <td class="py-2">{{ m.name }}</td>
            <td class="py-2">{{ m.brand?.name ?? '—' }}</td>
            <td class="py-2">{{ m.segment }}</td>
            <td class="py-2">
              <div class="action-buttons">
                <button mat-stroked-button color="primary" (click)="openEdit(m)">
                  <mat-icon class="action-icon">edit</mat-icon>
                  Editar
                </button>
                <button mat-stroked-button color="error" (click)="confirmDelete(m)">
                  <mat-icon class="action-icon">delete</mat-icon>
                  Eliminar
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }

  @if (dialogMode() === 'open') {
    <app-admin-edit-dialog
      [entityKey]="'model'"
      [apiPath]="'models'"
      [entity]="$any(dialogEntity())"
      (save)="onSave($event)"
      (cancel)="closeDialog()"
    />
  }
</section>
