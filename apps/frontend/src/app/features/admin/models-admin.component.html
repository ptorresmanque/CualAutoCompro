<section>
  <header class="flex items-center justify-between mb-4 gap-2">
    <h2 class="text-xl font-bold">Modelos</h2>
    <button
      type="button"
      (click)="openCreate()"
      class="rounded-full bg-brand-600 text-white px-4 py-1.5 text-sm font-bold hover:bg-brand-700"
    >+ Nuevo</button>
  </header>

  <input
    type="text"
    placeholder="Buscar modelo, marca o segmento…"
    class="w-full mb-4 rounded border border-border px-3 py-2 text-sm"
    [value]="search()"
    (input)="onSearch($any($event.target).value)"
  />

  @if (error(); as err) {
    <div class="mb-3 rounded border border-warn bg-warn-light px-3 py-2 text-sm text-warn-dark">{{ err }}</div>
  }

  @if (loading()) {
    <p class="text-sm text-ink-muted">Cargando…</p>
  } @else if (displayed().length === 0) {
    <p class="text-sm text-ink-muted">No hay modelos.</p>
  } @else {
    <table class="w-full text-sm">
      <thead class="text-left text-xs text-ink-muted">
        <tr>
          <th class="py-2">
            <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
              (click)="toggleSort('name')"
              [attr.aria-sort]="sortKey() === 'name' ? (sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
              Nombre
              <span class="material-symbols-outlined text-sm">{{ sortKey() === 'name' ? (sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</span>
            </button>
          </th>
          <th class="py-2">
            <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
              (click)="toggleSort('brandName')"
              [attr.aria-sort]="sortKey() === 'brandName' ? (sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
              Marca
              <span class="material-symbols-outlined text-sm">{{ sortKey() === 'brandName' ? (sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</span>
            </button>
          </th>
          <th class="py-2">
            <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
              (click)="toggleSort('segment')"
              [attr.aria-sort]="sortKey() === 'segment' ? (sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
              Segmento
              <span class="material-symbols-outlined text-sm">{{ sortKey() === 'segment' ? (sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</span>
            </button>
          </th>
          <th class="py-2 w-32">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (m of displayed(); track m.id) {
          <tr class="border-t border-border">
            <td class="py-2">{{ m.name }}</td>
            <td class="py-2">{{ m.brand?.name ?? '—' }}</td>
            <td class="py-2">{{ m.segment }}</td>
            <td class="py-2">
              <button class="text-brand-700 mr-2" (click)="openEdit(m)">Editar</button>
              <button class="text-warn-dark" (click)="confirmDelete(m)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }

  @if (dialogMode() === 'open') {
    <app-admin-edit-dialog
      [entityKey]="'model'"
      [apiPath]="'models'"
      [entity]="$any(dialogEntity())"
      (save)="onSave($event)"
      (cancel)="closeDialog()"
    />
  }
</section>
