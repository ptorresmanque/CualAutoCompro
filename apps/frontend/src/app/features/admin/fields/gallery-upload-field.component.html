<div class="flex flex-col gap-2 w-full">
  @if (urls().length > 0) {
    <ul data-testid="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
      @for (url of urls(); track trackByUrl($index, url); let i = $index) {
        <li class="relative aspect-square rounded border border-border overflow-hidden bg-surface">
          <img data-testid="gallery-thumb" [src]="previewUrl(url)" alt="" class="w-full h-full object-cover" />
          <button
            type="button"
            data-testid="gallery-remove"
            (click)="removeAt(i)"
            class="absolute top-1 right-1 rounded-full bg-surface/90 p-1 text-ink-muted hover:text-warn-dark"
            [attr.aria-label]="'Quitar imagen ' + (i + 1)"
          >
            <span class="material-symbols-outlined text-base">close</span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="text-xs text-ink-muted">Sin imágenes en la galería.</p>
  }
  <label class="inline-flex items-center gap-2 rounded border border-border px-3 py-1.5 text-sm cursor-pointer hover:bg-surface w-fit">
    <span class="material-symbols-outlined text-base">add_photo_alternate</span>
    <span>{{ uploading() ? 'Subiendo…' : 'Agregar imagen' }}</span>
    <input
      type="file"
      accept="image/*"
      multiple
      class="hidden"
      (change)="onFileChange($event)"
    />
  </label>
  @if (error(); as err) {
    <p data-testid="gallery-error" class="text-warn-dark text-xs">{{ err }}</p>
  }
</div>
