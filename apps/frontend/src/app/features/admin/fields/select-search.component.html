<div class="select-search-field">
  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
    <input
      #input
      matInput
      type="text"
      role="combobox"
      [attr.aria-expanded]="open()"
      [attr.aria-activedescendant]="open() && filtered().length > 0 ? 'option-' + activeIndex() : null"
      aria-autocomplete="list"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (focus)="open.set(true)"
      (keydown.escape)="open.set(false)"
      (keydown.arrowdown)="onArrowDown($event)"
      (keydown.arrowup)="onArrowUp($event)"
      (keydown.enter)="onEnter($event)"
    />
  </mat-form-field>

  @if (open() && filtered().length > 0) {
    <ul role="listbox" class="select-search-list">
      @for (item of filtered(); track item.label; let i = $index) {
        <li
          [attr.id]="'option-' + i"
          role="option"
          [attr.aria-selected]="activeIndex() === i"
          [class.active]="activeIndex() === i"
          [class.is-other]="item.isOther"
          [attr.data-testid]="'select-option-' + i"
          (click)="pick(item)"
        >
          @if (item.isOther) {
            <button type="button" data-testid="select-other" class="select-other-btn">{{ item.label }}</button>
          } @else {
            {{ item.label }}
          }
        </li>
      }
    </ul>
  }
</div>
