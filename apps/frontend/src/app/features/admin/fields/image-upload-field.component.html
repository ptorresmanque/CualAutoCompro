<div class="flex flex-col gap-2 w-full">
  @if (previewUrl(); as url) {
    <div class="relative w-full h-32 rounded border border-rule overflow-hidden bg-paper-cool">
      <img data-testid="preview" [src]="url" alt="Preview" class="w-full h-full object-contain" />
      <button
        mat-icon-button
        type="button"
        data-testid="clear"
        (click)="clear()"
        class="!absolute top-1 right-1"
        aria-label="Quitar imagen"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
  <button
    mat-stroked-button
    type="button"
    (click)="fileInput.click()"
    [disabled]="uploading()"
  >
    <mat-icon>upload</mat-icon>
    <span>{{ uploading() ? 'Subiendo…' : 'Subir imagen' }}</span>
  </button>
  <input
    #fileInput
    type="file"
    accept="image/avif,image/webp,image/png,image/jpeg,image/gif"
    class="hidden"
    (change)="onFileChange($event)"
  />
  @if (error(); as err) {
    <p class="text-danger-dark text-xs">{{ err }}</p>
  }
</div>
