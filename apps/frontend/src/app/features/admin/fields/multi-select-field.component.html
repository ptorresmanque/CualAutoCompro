<div class="flex flex-col gap-2 w-full">


  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
    <input
      matInput
      type="text"
      data-testid="ms-input"
      role="combobox"
      [attr.aria-expanded]="open()"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (focus)="open.set(true)"
      (keydown.escape)="open.set(false)"
      [placeholder]="placeholder()"
    />
    <ng-content select="[matError]" />
  </mat-form-field>

  @if (open() && available().length > 0) {
    <ul
      data-testid="ms-options"
      role="listbox"
      class="max-h-60 overflow-auto rounded border border-border bg-surface shadow-e2"
    >
      @for (item of available(); track item.id) {
        <li
          data-testid="ms-option"
          role="option"
          (click)="pick(item)"
          class="px-3 py-1.5 text-sm cursor-pointer hover:bg-engine-50"
        >
          {{ item[optionLabel()] }}
        </li>
      }
    </ul>
  }

  @if (selectedIds().length > 0) {
    <mat-chip-set data-testid="ms-chips" aria-label="Seleccionados">
      @for (id of selectedIds(); track id) {
        <mat-chip
          [attr.data-testid]="'ms-chip'"
          (removed)="removeAt(id)"
        >
          {{ labelOf(id) }}
          <button
            matChipRemove
            [attr.aria-label]="'Quitar ' + labelOf(id)"
            [attr.data-testid]="'ms-chip-remove'"
          >
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      }
    </mat-chip-set>
  }



  @if (error(); as err) {
    <p class="text-warn-dark text-xs">{{ err }}</p>
  }
</div>
