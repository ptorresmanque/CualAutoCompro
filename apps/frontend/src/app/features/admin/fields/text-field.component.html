@if (multiline()) {
  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
    <textarea
      matInput
      rows="2"
      [formControl]="$any(control())"
      [attr.aria-required]="required() ? 'true' : null"
    ></textarea>
    <ng-content select="[matError]" />
  </mat-form-field>
} @else {
  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
    <input
      matInput
      type="text"
      [formControl]="$any(control())"
      [attr.aria-required]="required() ? 'true' : null"
    />
    <ng-content select="[matError]" />
  </mat-form-field>
}
