@if (multiline()) {
  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
    <textarea
      matInput
      rows="2"
      [formControl]="$any(control())"
    ></textarea>
  </mat-form-field>
} @else {
  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
    <input
      matInput
      type="text"
      [formControl]="$any(control())"
    />
  </mat-form-field>
}
