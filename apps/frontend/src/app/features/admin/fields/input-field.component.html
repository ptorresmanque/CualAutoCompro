<mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
  @if (multiline()) {
    <textarea
      matInput
      rows="2"
      [formControl]="$any(control())"
      [attr.aria-required]="required() ? 'true' : null"
    ></textarea>
  } @else if (thousands()) {
    <input
      matInput
      type="text"
      inputmode="numeric"
      [value]="display()"
      (input)="onThousandsInput($any($event.target))"
      (blur)="control().markAsTouched()"
      [attr.aria-required]="required() ? 'true' : null"
    />
  } @else if (type() === 'number') {
    <!-- `type` estático a propósito: Angular elige el ControlValueAccessor por
         selector en compilación, y con `[type]` dinámico no engancha
         NumberValueAccessor — el control emitiría string en vez de number. -->
    <input
      matInput
      type="number"
      [formControl]="$any(control())"
      [attr.aria-required]="required() ? 'true' : null"
    />
  } @else {
    <input
      matInput
      type="text"
      [formControl]="$any(control())"
      [attr.aria-required]="required() ? 'true' : null"
    />
  }
  <ng-content select="[matError]" />
</mat-form-field>
