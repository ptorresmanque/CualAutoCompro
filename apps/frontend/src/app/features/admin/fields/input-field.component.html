<mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
  @if (multiline()) {
    <textarea
      matInput
      rows="2"
      [formControl]="$any(control())"
      [attr.aria-required]="required() ? 'true' : null"
    ></textarea>
  } @else if (thousands()) {
    <input
      matInput
      type="text"
      inputmode="numeric"
      [value]="display()"
      (input)="onThousandsInput($any($event.target))"
      (blur)="control().markAsTouched()"
      [attr.aria-required]="required() ? 'true' : null"
    />
  } @else {
    <input
      matInput
      [type]="type()"
      [formControl]="$any(control())"
      [attr.aria-required]="required() ? 'true' : null"
    />
  }
  <ng-content select="[matError]" />
</mat-form-field>
