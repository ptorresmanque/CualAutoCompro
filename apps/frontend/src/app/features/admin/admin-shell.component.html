<section class="mx-auto max-w-7xl px-4 md:px-8 py-6">
  <h1 class="text-2xl font-bold text-ink mb-4">Panel de administración</h1>
  <nav mat-tab-nav-bar mat-stretch-tabs="false" class="admin-shell-tabs" [tabPanel]="panel">
    @for (l of subLinks; track l.path) {
      <a mat-tab-link [routerLink]="l.path" [routerLinkActiveOptions]="{ exact: l.path === '/admin' }" [active]="isActive(l.path)">{{ l.label }}</a>
    }
  </nav>
  <mat-tab-nav-panel #panel>
    <router-outlet />
  </mat-tab-nav-panel>
</section>
