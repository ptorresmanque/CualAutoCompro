<section>
  <header class="flex items-center justify-between mb-4 gap-2">
    <h2 class="text-xl font-bold">Equipamiento</h2>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="crud.openCreate()"
    >+ Nuevo</button>
  </header>

  <app-search-input
    placeholder="Buscar equipamiento o categoría…"
    [value]="crud.search()"
    (changed)="crud.onSearch($event)"
  />

  @if (crud.error(); as err) {
    <div class="mb-3 flex items-center justify-between gap-2 rounded border border-danger bg-danger-light px-3 py-2 text-sm text-danger-dark">
      <span>{{ err }}</span>
      <button mat-button type="button" (click)="crud.retry()">Reintentar</button>
    </div>
  }

  @if (crud.loading()) {
    <p class="text-sm text-ink-muted">Cargando…</p>
  } @else if (crud.displayed().length === 0) {
    <p class="text-sm text-ink-muted">No hay equipamiento.</p>
  } @else {
    <div class="admin-table-scroll">
      <table class="admin-table w-full text-sm">
        <thead class="text-left text-xs text-ink-muted">
          <tr>
            <th class="py-2">
              <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
                (click)="crud.toggleSort('name')"
                [attr.aria-sort]="crud.sortKey() === 'name' ? (crud.sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
                Nombre
                <mat-icon class="sort-icon">{{ crud.sortKey() === 'name' ? (crud.sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</mat-icon>
              </button>
            </th>
            <th class="py-2">
              <button type="button" class="sort-header font-bold uppercase tracking-wide hover:text-ink"
                (click)="crud.toggleSort('category')"
                [attr.aria-sort]="crud.sortKey() === 'category' ? (crud.sortDir() === 'asc' ? 'ascending' : 'descending') : 'none'">
                Categoría
                <mat-icon class="sort-icon">{{ crud.sortKey() === 'category' ? (crud.sortDir() === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}</mat-icon>
              </button>
            </th>
            <th class="py-2 actions-col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (e of crud.displayed(); track e.id) {
            <tr class="border-t border-border">
              <td class="py-2">{{ e.name }}</td>
              <td class="py-2">{{ e.category }}</td>
              <td class="py-2 actions-col">
                <div class="action-buttons">
                  <button mat-stroked-button color="primary" (click)="crud.openEdit(e)">
                    <mat-icon class="action-icon">edit</mat-icon>
                    <span class="action-label">Editar</span>
                  </button>
                  <button mat-stroked-button (click)="crud.openDuplicate(e)">
                    <mat-icon class="action-icon">content_copy</mat-icon>
                    <span class="action-label">Duplicar</span>
                  </button>
                  <button mat-stroked-button class="action-danger" (click)="crud.confirmDelete(e)">
                    <mat-icon class="action-icon">delete</mat-icon>
                    <span class="action-label">Eliminar</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination
      [meta]="crud.pagination()"
      [loading]="crud.loading()"
      (pageChange)="crud.onPageChange($event)"
      (pageSizeChange)="crud.onPageSizeChange($event)"
    />
  }

  @if (crud.dialogMode() !== 'closed') {
    <app-admin-edit-dialog
      [entityKey]="'equipment'"
      [apiPath]="'equipment'"
      [entity]="$any(crud.dialogEntity())"
      [mode]="$any(crud.dialogMode())"
      (save)="crud.save($event)"
      (saveAndNew)="crud.saveAndNew($event)"
      (cancel)="crud.closeDialog()"
    />
  }
</section>
