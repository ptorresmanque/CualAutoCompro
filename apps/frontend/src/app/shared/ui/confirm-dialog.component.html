<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-stroked-button
    type="button"
    (click)="cancel()"
    data-testid="confirm-cancel"
  >{{ cancelLabel }}</button>
  <button
    mat-flat-button
    [color]="confirmColor"
    type="button"
    (click)="confirm()"
    data-testid="confirm-accept"
  >{{ confirmLabel }}</button>
</mat-dialog-actions>
