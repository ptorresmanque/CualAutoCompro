<body class="bg-surface-container-low min-h-screen flex flex-col items-center justify-center px-margin-mobile">

<!-- Email Field -->
<div class="space-y-xs">

                        EMAIL
                    </label>
<input class="w-full h-12 px-md font-body-md text-body-md border border-outline-variant rounded-lg bg-surface input-focus-ring transition-all" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant tracking-wider block uppercase" for="password">
                        CONTRASEÑA
                    </label>
<div class="relative">
<input class="w-full h-12 px-md font-body-md text-body-md border border-outline-variant rounded-lg bg-surface input-focus-ring transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>

<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>

<div class="absolute -bottom-[10%] -right-[5%] w-[30%] h-[30%] bg-secondary/5 rounded-full blur-[80px]"></div>
</div>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Password toggle logic
            const togglePass = document.querySelector('.relative button');
            const passInput = document.getElementById('password');
            const toggleIcon = togglePass.querySelector('.material-symbols-outlined');

            togglePass.addEventListener('click', () => {
                const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });

            // Focus states for overall card feel
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.closest('.space-y-xs').querySelector('label').classList.replace('text-on-surface-variant', 'text-primary');
                });
                input.addEventListener('blur', () => {
                    input.closest('.space-y-xs').querySelector('label').classList.replace('text-primary', 'text-on-surface-variant');
                });
            });
        });
    </script>
