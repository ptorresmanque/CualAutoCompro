<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Subdued Animated Background Background -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">

</div>
<!-- Registration Card Container -->
<main class="relative z-10 w-full max-w-[448px] bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant transition-all duration-300">
<!-- Header / Logo -->
<div class="flex flex-col items-center pt-xl pb-md px-lg">
<img alt="cualautocompro.cl logo" class="w-24 h-auto mb-lg" src="https://lh3.googleusercontent.com/aida/AP1WRLvvl7z10UKj-FfTce2mc263yJp4e6MwTMx0MshFoR-egl-j7KaDMKYwADAxgfC66PS6Jkyl_kgI5pIJybzawmXZ6Gj-EKETs6CTOUwZfSMpEJpXbgI25-2IVVw1tOWvVYzepHYeS4KvW4DOj8Fa6K5-pIq7IRV-8c3EiCIYt07a1ajWLtaBedxjyqmGKdlPEv3u6ADp-fXKFJ_7DJflLyFTEIrMwFDHBvviCExZHXWUo2MpdD3Jj0qjcOAB"/>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Crear cuenta</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-4">
                Guarda tus comparaciones y compártelas con un link
            </p>
</div>
<!-- Registration Form -->
<form class="px-lg pb-lg space-y-md" id="registrationForm">
<!-- Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant tracking-wider" for="name">NOMBRE</label>
<input class="w-full px-md py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface font-body-md focus-teal transition-all outline-none" id="name" name="name" placeholder="Tu nombre" required="" type="text"/>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant tracking-wider" for="email">EMAIL</label>
<input class="w-full px-md py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface font-body-md focus-teal transition-all outline-none" id="email" name="email" placeholder="correo@ejemplo.cl" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface-variant tracking-wider" for="password">CONTRASEÑA</label>
<div class="relative">
<input class="w-full px-md py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface font-body-md focus-teal transition-all outline-none pr-12" id="password" name="password" placeholder="Mínimo 8 caracteres" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary-container font-label-md py-3 rounded-lg transition-all transform active:scale-[0.98] mt-lg shadow-sm" type="submit">
                Crear cuenta
            </button>
<!-- Secondary Action -->
<div class="text-center pt-md">
<a class="font-body-md text-primary hover:underline transition-all" href="#">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
</div>
</form>
<!-- Footer Disclaimer -->
<footer class="px-lg pb-xl text-center border-t border-outline-variant/30 pt-lg">
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed opacity-80">
                Al crear cuenta, aceptas nuestros <a class="underline hover:text-primary" href="#">términos de uso</a> y nuestra <a class="underline hover:text-primary" href="#">política de privacidad</a>.
            </p>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Form submission micro-interaction
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Creando...</span>';
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = originalText;
                alert('¡Solicitud de registro enviada! (Simulación)');
            }, 1500);
        });
    </script>
