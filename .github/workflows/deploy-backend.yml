name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-be
  cancel-in-progress: false

jobs:
  # Gate: los tests corren ANTES de migrar la base de producción. `test.yml` se
  # deja llamar con `workflow_call` justamente para esto — `needs:` solo cruza
  # jobs del mismo workflow, así que llamarlo es la única forma de que el deploy
  # dependa de verdad de los tests.
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm -w apps/backend run db:generate

      - name: Build backend
        run: npm -w apps/backend run build

      - name: Setup SSH key on runner
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          echo "=== Key file created ==="
          ls -la ~/.ssh/cpanel_deploy

      - name: Test SSH connection to server
        run: |
          ssh -i ~/.ssh/cpanel_deploy \
              -p ${{ secrets.CPANEL_PORT }} \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_HOST }} \
              "echo 'SSH OK'; whoami; pwd"

      - name: Tar backend artifacts and upload via SSH pipe
        run: |
          set -euxo pipefail
          echo "=== Building tarball locally ==="
          mkdir -p deploy-staging
          cp -r apps/backend/dist deploy-staging/dist
          cp -r apps/backend/prisma deploy-staging/prisma
          cp apps/backend/package.json deploy-staging/
          # No copiamos package-lock.json: el del root tiene workspaces de todo el monorepo
          # y haría fallar npm ci en el server. Usamos npm install --omit=dev (ver más abajo).
          tar czf - -C deploy-staging . > be-build.tgz
          rm -rf deploy-staging
          ls -la be-build.tgz

          echo "=== Uploading via SSH pipe ==="
          cat be-build.tgz | ssh -i ~/.ssh/cpanel_deploy \
              -p ${{ secrets.CPANEL_PORT }} \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_HOST }} \
              "cat > /home/rfkusewb/be-build.tgz && echo '=== UPLOAD DONE ===' && ls -la /home/rfkusewb/be-build.tgz"
          rm be-build.tgz

      - name: Extract, install, migrate, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            # En SSH no-interactivo, el `source activate` de cPanel falla porque referencia
            # CL_VIRTUAL_ENV (set -u). Seteamos PATH manualmente:
            #   - nodevenv bin: provee node y npm vinculados a la versión 20.x
            #   - alt-nodejs20 bin: provee npx (que tu server tiene acá, no en el nodevenv)
            export PATH=/home/rfkusewb/nodevenv/cualauto-backend/20/bin:/opt/alt/alt-nodejs20/root/usr/bin:$PATH

            cd /home/rfkusewb

            echo "=== Tarball check ==="
            ls -la /home/rfkusewb/be-build.tgz

            # 0. Limpiar restos de un deploy anterior que haya quedado a medias
            #    (NO incluir be-build.tgz porque lo necesitamos para extraer)
            rm -rf be-staging

            # 1. Extraer tarball en staging limpio
            mkdir -p be-staging
            tar xzf be-build.tgz -C be-staging
            rm be-build.tgz

            # 2. Swap staging sobre el app root
            BACKEND=/home/rfkusewb/cualauto-backend
            cd $BACKEND

            rm -rf dist prisma
            rm -f package.json

            mv /home/rfkusewb/be-staging/dist ./dist
            mv /home/rfkusewb/be-staging/prisma ./prisma
            mv /home/rfkusewb/be-staging/package.json ./
            rmdir /home/rfkusewb/be-staging 2>/dev/null || rm -rf /home/rfkusewb/be-staging

            # 3. Asegurar tmp/ existe (Passenger)
            mkdir -p tmp

            # 4. Instalar dependencias de producción
            npm install --omit=dev --no-audit --no-fund --no-save

            # 5. Regenerar Prisma client (porque node_modules es nuevo)
            npx prisma generate

            # 6. Aplicar migraciones pendientes
            npx prisma migrate deploy

            # 7. Reiniciar Passenger (lee tmp/restart.txt y recicla workers)
            touch tmp/restart.txt

            echo "BE DEPLOY OK"

      - name: Health check (backend)
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 3 https://cualautocompro.cl/health