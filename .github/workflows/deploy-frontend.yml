name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-fe
  cancel-in-progress: false

jobs:
  # Gate: los tests corren ANTES de tocar el server. `test.yml` se deja llamar
  # con `workflow_call` justamente para esto — `needs:` solo cruza jobs del
  # mismo workflow, así que llamarlo es la única forma de que el deploy dependa
  # de verdad de los tests.
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (production)
        run: npm -w apps/frontend run build -- --configuration production

      - name: Setup SSH key on runner
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          echo "=== Key file created ==="
          ls -la ~/.ssh/cpanel_deploy
          head -1 ~/.ssh/cpanel_deploy

      - name: Test SSH connection to server
        run: |
          ssh -i ~/.ssh/cpanel_deploy \
              -p ${{ secrets.CPANEL_PORT }} \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_HOST }} \
              "echo 'SSH OK'; whoami; pwd; ls -la ~/fe-build.tgz 2>&1 || true"

      - name: Upload build via SSH pipe (streamed)
        run: |
          set -euxo pipefail
          echo "=== Building tarball locally ==="
          tar czf - -C apps/frontend/dist/frontend/browser . > fe-build.tgz
          ls -la fe-build.tgz
          echo "=== Uploading via SSH pipe ==="
          cat fe-build.tgz | ssh -i ~/.ssh/cpanel_deploy \
              -p ${{ secrets.CPANEL_PORT }} \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_HOST }} \
              "cat > /home/rfkusewb/fe-build.tgz && echo '=== UPLOAD DONE ===' && ls -la /home/rfkusewb/fe-build.tgz"
          rm fe-build.tgz

      - name: Extract and atomic swap with protected file preservation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /home/rfkusewb

            echo "=== Tarball check ==="
            ls -la /home/rfkusewb/fe-build.tgz

            # 0. Limpiar restos de un deploy anterior que haya quedado a medias
            #    (NO incluir fe-build.tgz porque lo necesitamos para extraer)
            rm -rf public_html.old fe-staging

            # 1. Extraer tarball en staging limpio
            mkdir -p fe-staging
            tar xzf fe-build.tgz -C fe-staging
            rm fe-build.tgz

            # 2. Preservar archivos protegidos copiándolos al staging antes del swap
            for protected in .htaccess .user.ini .well-known cgi-bin; do
              if [ -e "public_html/$protected" ]; then
                cp -r "public_html/$protected" "fe-staging/$protected"
                echo "preserved: $protected"
              fi
            done

            # 3. Swap atómico: rename del directorio (operación de filesystem, microsegundos)
            mv public_html public_html.old
            mv fe-staging public_html

            # 4. Limpiar el viejo (con los huérfanos del build anterior)
            rm -rf public_html.old

            echo "FE DEPLOY OK"
            ls -la /home/rfkusewb/public_html/ | head -20

      - name: Health check
        run: |
          sleep 3
          curl -fsS --retry 5 --retry-delay 3 https://cualautocompro.cl/ | head -c 300