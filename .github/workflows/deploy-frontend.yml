name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-fe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (production)
        run: npm -w apps/frontend run build -- --configuration production

      - name: Setup SSH key for rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy

      - name: Sync FE build to public_html (delete orphans, protect configs)
        run: |
          rsync -avz --delete \
            --filter='P .htaccess' \
            --filter='P .user.ini' \
            --filter='P .well-known' \
            --filter='P .well-known/**' \
            --filter='P cgi-bin' \
            --filter='P cgi-bin/**' \
            -e "ssh -i ~/.ssh/cpanel_deploy -p ${{ secrets.CPANEL_PORT }} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null" \
            apps/frontend/dist/frontend/browser/ \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_HOST }}:/home/rfkusewb/public_html/

      - name: Health check
        run: |
          sleep 3
          curl -fsS --retry 5 --retry-delay 3 https://cualautocompro.cl/ | head -c 300