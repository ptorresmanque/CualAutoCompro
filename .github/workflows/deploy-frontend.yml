name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-fe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (production)
        run: npm -w apps/frontend run build -- --configuration production

      - name: Upload build to staging dir on cPanel
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "apps/frontend/dist/frontend/browser"
          target: "/home/rfkusewb/fe-staging"
          overwrite: true

      - name: Atomic swap with protected file preservation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /home/rfkusewb

            # 1. Preservar archivos protegidos copiándolos al staging antes del swap
            for protected in .htaccess .user.ini .well-known cgi-bin; do
              if [ -e "public_html/$protected" ]; then
                cp -r "public_html/$protected" "fe-staging/$protected"
                echo "preserved: $protected"
              fi
            done

            # 2. Swap atómico: rename del directorio (operación de filesystem, microsegundos)
            mv public_html public_html.old
            mv fe-staging public_html

            # 3. Limpiar el viejo (con los huérfanos del build anterior)
            rm -rf public_html.old

            echo "FE DEPLOY OK"
            ls -la /home/rfkusewb/public_html/ | head -20

      - name: Health check
        run: |
          sleep 3
          curl -fsS --retry 5 --retry-delay 3 https://cualautocompro.cl/ | head -c 300